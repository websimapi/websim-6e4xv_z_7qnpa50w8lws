<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGPU Voxel Engine</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: white; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
            transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
        }
        #debug-info { position: absolute; top: 10px; left: 10px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; pointer-events: auto;}
        #controls-zone { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; pointer-events: auto; }
        #mobile-actions { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 15px; pointer-events: auto; }
        .action-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); backdrop-filter: blur(4px); touch-action: none; }
        .action-btn:active { background: rgba(255,255,255,0.5); }
        #init-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; justify-content: center; align-items: center; z-index: 999;
            flex-direction: column;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "gl-matrix": "https://esm.sh/gl-matrix@3.4.3",
            "nipplejs": "https://esm.sh/nipplejs@0.10.1"
        }
    }
    </script>
</head>
<body>
    <div id="init-overlay">
        <div class="spinner"></div>
        <div id="status-text">Initializing WebGPU...</div>
    </div>
    
    <canvas id="gfx"></canvas>
    
    <div id="ui-layer">
        <div id="debug-info">
            <div>FPS: <span id="fps">0</span></div>
            <div>Voxels: <span id="voxel-count">0</span></div>
            <div>Draws: <span id="draw-count">0</span></div>
        </div>
        <div id="crosshair"></div>
        <div id="controls-zone"></div> <!-- NippleJS Zone -->
        <div id="mobile-actions">
            <div class="action-btn" id="btn-jump" data-action="jump"></div>
            <div class="action-btn" id="btn-place" data-action="place"></div>
            <div class="action-btn" id="btn-break" data-action="break"></div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
